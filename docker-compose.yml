services:
  node1:
    image: hyperledger/besu:latest
    container_name: node1
    volumes:
      - ./node1/data:/data
      - ./node1/genesis.json:/genesis.json
    command: >
      --data-path=/data
      --genesis-file=/genesis.json
      --rpc-http-enabled
      --rpc-http-api=ETH,NET,IBFT
      --host-allowlist="*"
      --rpc-http-cors-origins="*"
      --p2p-port=30303
      --rpc-http-port=8545
    ports:
      - "8545:8545"
      - "30303:30303"
    networks:
      besu-network:
        ipv4_address: 172.16.239.11

  node2:
    image: hyperledger/besu:latest
    container_name: node2
